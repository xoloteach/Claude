[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*, docs/*, build/*, export/*, .github/*, README.md"
export_path="build/web/index.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name='theme-color' content='#0b0c0f'>
<style>
body, #status { background-color: #0b0c0f !important; color: #c8ccd4; }
#status::before {
	content: 'IRONLINE';
	font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif;
	font-weight: 800; font-size: 3.2rem; letter-spacing: 0.6rem;
	color: #e8eaee; margin-bottom: 2.5rem;
	text-shadow: 0 0 18px rgba(255, 120, 40, 0.35);
}
#status-progress {
	-webkit-appearance: none; appearance: none;
	height: 6px; border: 0; border-radius: 3px; background: #1d2027;
	width: 40%; max-width: 520px;
}
#status-progress::-webkit-progress-bar { background: #1d2027; border-radius: 3px; }
#status-progress::-webkit-progress-value { background: #ff7a2a; border-radius: 3px; }
#status-progress::-moz-progress-bar { background: #ff7a2a; border-radius: 3px; }
#status-notice { background-color: #2a1a1d; border-color: #7a2a33; color: #e6d6d8; }
</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.043, 0.047, 0.059, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
